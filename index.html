<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12172038' data-sdk='show_12172038'></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:12px;text-align:center}#bal{color:#00ff88;font-size:22px;font-weight:bold}.video-box{background:#111;border-radius:14px;padding:10px;margin:15px 0}.video-thumb{width:100%;height:200px;border-radius:10px;object-fit:cover}button{border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}.earn{background:#ff004f;color:#fff}.withdraw{background:#00c853;color:#fff;margin:15px 0}.withdraw:disabled{background:#333;color:#888}.ref-box{background:#1a1a2e;border:1px solid #00ff88;border-radius:12px;padding:12px;margin:15px 0}</style>
</head><body>
<h2>🎵 SHAYA WATCH</h2>
<p id="bal">Balance: R0.00</p>
<button id="wBtn" class="withdraw" onclick="requestWithdraw()">💸 WITHDRAW (Min R10)</button>
<div class="ref-box">
<b>🔗 Earn R2.50 per friend!</b>
<p style="font-size:12px">Friend must watch 5 ads, you get R2.50</p>
<input id="refLink" style="width:90%;padding:8px;border-radius:8px;border:none" readonly>
<button onclick="copyRef()" style="background:#00ff88;color:#000;padding:8px;margin-top:5px">📋 COPY LINK</button>
<p id="refStats" style="font-size:13px;margin-top:8px"></p>
</div>
<p style="font-size:12px;color:#888">Earn R0.10 per ad</p>
<div id="list"></div>
<script>
const tg=Telegram.WebApp;tg.expand();
const API_URL='https://shayawatchmnelisibot-4.onrender.com';
const USER_EARN=0.10;
let userId=tg?.initDataUnsafe?.user?.id;
let username=tg?.initDataUnsafe?.user?.username||tg?.initDataUnsafe?.user?.first_name||'guest';
let startParam=tg?.initDataUnsafe?.start_param||'';
let referredBy=null;
if(startParam.startsWith('ref_')) referredBy=startParam.replace('ref_','');
if(!userId){userId=localStorage.getItem('shaya_userId')||'guest_'+Math.random().toString(36).substr(2,9);localStorage.setItem('shaya_userId',userId);}
let bal=0;
function updateBalUI(d){
  bal=d.balance||0;
  document.getElementById('bal').innerText=`Balance: R${bal.toFixed(2)}`;
  document.getElementById('wBtn').innerText=`💸 WITHDRAW R${bal.toFixed(2)} (Min R10.00)`;
  document.getElementById('wBtn').disabled=bal<10;
  const link=`https://t.me/ShayaWatchMnelisibot?start=ref_${userId}`;
  document.getElementById('refLink').value=link;
  document.getElementById('refStats').innerText=`👥 Referrals: ${d.refEarned||0} paid, ${d.refPending||0} pending • Ads watched: ${d.adsWatched||0}/5`;
  localStorage.setItem('shaya_bal',bal);
}
async function loadBalance(){
  try{const res=await fetch(`${API_URL}/api/balance?userId=${userId}`);const data=await res.json();updateBalUI(data);}catch(e){bal=Number(localStorage.getItem('shaya_bal')||0);document.getElementById('bal').innerText=`Balance: R${bal.toFixed(2)}`;}
}
loadBalance();
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').value);alert('✅ Link copied! Share on WhatsApp!');}
const VIDS=["y4h7YEGo5-I","Yi8Lcry8IzY","bvl39nmaOYU","K9Ge-bBCPjM","rpeMjYRQgxU","1pNf7Sl9w8E","9B3vAyeF6lU","nkE3yC5PQRE","KRYyPCKPTsw","GqKzS6Bn8UQ"];
const list=document.getElementById('list');
VIDS.forEach(id=>{list.innerHTML+=`<div class="video-box"><img class="video-thumb" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" onclick="window.open('https://youtu.be/${id}','_blank')"><button class="earn" onclick="earn()">▶️ Watch Ad & Earn R${USER_EARN.toFixed(2)}</button></div>`;});
async function earn(){
  if(typeof show_12172038!=='function'){alert('Ad loading...');return;}
  try{await show_12172038();const res=await fetch(`${API_URL}/api/earn`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,referredBy})});const data=await res.json();loadBalance();alert(`✅ +R${USER_EARN.toFixed(2)} earned! ${data.adsWatched||0}/5 ads`);}catch(e){alert('No ad, try in 30 sec');}
}
async function requestWithdraw(){
  if(bal<10) return alert(`Need R10. Have R${bal.toFixed(2)}. Need ${Math.ceil((10-bal)/USER_EARN)} more ads!`);
  const method=prompt("Method? Capitec / FNB / PayPal");if(!method)return;
  const account=prompt(`Enter ${method} details:`);if(!account)return;
  const res=await fetch(`${API_URL}/api/withdraw`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,method,account,amount:bal})});const data=await res.json();if(data.success){alert('✅ '+data.message);bal=0;loadBalance();}else alert('❌ '+data.error);
}
</script></body></html>
