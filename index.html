<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12172038' data-sdk='show_12172038'></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px;text-align:center}#bal{color:#00ff88;font-size:22px;font-weight:bold}button{background:#ff004f;color:#fff;border:none;padding:15px;width:100%;border-radius:12px;margin-top:10px;font-weight:bold}</style>
</head>
<body>
<h2>🎵 SHAYA WATCH</h2>
<p id="bal">Loading balance...</p>
<button onclick="earn()">▶️ Watch Ad & Earn R0.50</button>
<p style="font-size:12px;color:#888">Monetag Zone 12172038 ACTIVE</p>
<script>
const tg = Telegram.WebApp; tg.expand();
const userId = tg.initDataUnsafe?.user?.id;
document.getElementById('bal').innerText = `Your ID: ${userId}`;

function earn(){
  show_12172038('pop').then(()=>{
    // After ad, call your bot backend to add balance
    fetch('/api/earn', {
      method: 'POST',
      body: JSON.stringify({telegram_id: userId, amount: 0.50})
    }).then(()=> alert('✅ +R0.50 Added! Go back to bot and type /balance'));
  }).catch(()=> alert('No ad, try again'));
}
</script>
</body>
</html>
