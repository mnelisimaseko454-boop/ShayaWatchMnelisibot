<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='https://libtl.com/sdk.js' data-zone='12172038' data-sdk='show_12172038'></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;text-align:center}
#bal{color:#00ff88;font-size:22px;font-weight:bold}
.video-box{background:#111;border-radius:14px;padding:10px;margin:15px 0}
iframe{width:100%;height:200px;border:none;border-radius:10px}
button{background:#ff004f;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<h2>🎵 SHAYA WATCH</h2>
<p id="bal">Balance: R0.00</p>
<div id="list"></div>

<script>
const tg = Telegram.WebApp;
tg.expand();

let bal = Number(localStorage.getItem('shaya_bal')||0);
document.getElementById('bal').innerText = `Balance: R${bal.toFixed(2)}`;

const VIDS = ["8qd-mgCEk7E","LXb3EKWsInQ"];
const list = document.getElementById('list');

VIDS.forEach(id=>{
  list.innerHTML+=`<div class="video-box">
  <iframe src="https://www.youtube.com/embed/${id}"></iframe>
  <button onclick="earn()">▶️ Watch Ad & Earn R0.50</button>
  </div>`;
});

function earn(){
  if(typeof show_12172038 !== 'function'){
    alert('Ads loading... Wait 5 seconds and try again!');
    return;
  }
  show_12172038().then(()=>{
    bal+=0.5;
    localStorage.setItem('shaya_bal',bal);
    document.getElementById('bal').innerText=`Balance: R${bal.toFixed(2)}`;
    alert('✅ +R0.50 earned!');
  }).catch(e=>{
    alert('No ad available right now, try again in 30 sec');
    console.log(e);
  });
}
</script>
</body>
</html>
