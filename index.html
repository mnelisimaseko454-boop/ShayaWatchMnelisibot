ers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,referredBy})}); const data=await res.json();updateBalUI(data); alert('You have seen an ad! +R'+USER_EARN.toFixed(2)); loadMonetagStats(); }catch(e){ try{ await show_12172038({ ymid: userId, type: 'pop' }); const res=await fetch(`${API_URL}/api/earn`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,referredBy})}); const data=await res.json();updateBalUI(data); alert('You have seen an ad! +R'+USER_EARN.toFixed(2)); loadMonetagStats(); }catch(e2){ alert('No ad now, try in 30 sec'); } } } async function earnPopup(){ if(typeof show_12172038!=='function'){alert('Ad loading...');return;} try{ await show_12172038({ ymid: userId, type: 'pop' }); const res=await fetch(`${API_URL}/api/earn`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,referredBy})}); const data=await res.json();updateBalUI(data); alert('You have seen an ad! Extra +R'+USER_EARN.toFixed(2)); loadMonetagStats(); }catch(e){ alert('Offer not ready, try again'); } } async function requestWithdraw(){ const balText=document.getElementById('bal').innerText; const bal=parseFloat(balText.replace(/[^0-9.]/g,''))||0; if(bal<10) return alert(`Need R10 minimum. You have R${bal.toFixed(2)}`); const method=prompt("Method? Capitec / FNB / PayPal / eWallet");if(!method)return; const account=prompt(`Enter ${method} details:`);if(!account)return; try{const res=await fetch(`${API_URL}/api/withdraw`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,method,account,amount:bal})});const data=await res.json();if(data.success){alert('✅ '+data.message);loadBalance();}else alert('❌ '+data.error);}catch(e){alert('Network error');} } </script></body></html>
