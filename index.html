<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12172038' data-sdk='show_12172038'></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;text-align:center}
#bal{color:#00ff88;font-size:22px;font-weight:bold}
.video-box{background:#111;border-radius:14px;padding:10px;margin:15px 0}
iframe{width:100%;height:200px;border:none;border-radius:10px}
button{background:#ff004f;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<h2>🎵 SHAYA WATCH</h2>
<p id="bal">Balance: R0.00</p>
<div id="list"></div>
<script>
const tg=Telegram.WebApp; tg.expand();
let bal=Number(localStorage.getItem('shaya_bal')||0);
document.getElementById('bal').innerText=`Balance: R${bal.toFixed(2)}`;
const VIDS=["y4h7YEGo5-I","Yi8Lcry8IzY","bvl39nmaOYU","K9Ge-bBCPjM","rpeMjYRQgxU","1pNf7Sl9w8E","9B3vAyeF6lU","nkE3yC5PQRE","KRYyPCKPTsw","GqKzS6Bn8UQ","qIl1MbWiCXA","8NeY9z6Q5vA","e4w8Bv2Q9kL","xFYQQPAOz7Y","YVkUvmDQ3HY","j5a0jTc9S10"];
const list=document.getElementById('list');
VIDS.forEach(id=>{
list.innerHTML+=`<div class="video-box"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe><button onclick="earn()">▶️ Watch Ad & Earn R0.50</button></div>`;
});
function earn(){
if(typeof show_12172038!=='function'){alert('Ad loading... wait 5 sec');return;}
show_12172038().then(()=>{
bal+=0.5;localStorage.setItem('shaya_bal',bal);
document.getElementById('bal').innerText=`Balance: R${bal.toFixed(2)}`;
alert('✅ +R0.50 earned!');
}).catch(()=>alert('No ad now, try again in 30 sec'));
}
</script>
</body>
</html>
